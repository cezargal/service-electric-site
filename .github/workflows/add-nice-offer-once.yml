name: Add Nice offer once
on:
  push:
    paths:
      - '.github/workflows/add-nice-offer-once.yml'
jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add Nice offer after BFT
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('oferta-bft.html')
          s=p.read_text(encoding='utf-8')
          if 'id="nice-offer"' in s:
              raise SystemExit('Nice offer already exists')
          css='''#nice-offer{margin-top:34px;padding-top:34px;border-top:2px solid #e7edf3}#nice-offer .nice-title{font-size:34px;line-height:1.1;margin:0 0 7px;text-align:center}#nice-offer .nice-title span{color:#0877ff}#nice-offer .nice-sub{text-align:center;color:#536170;font-size:16px;margin:0 0 20px}#nice-offer .nice-photo{margin:0 auto 22px;max-width:900px;background:#fff;border:1px solid #e0e7ef;border-radius:20px;padding:10px;box-shadow:0 12px 35px #071a3812}#nice-offer .nice-photo img{display:block;width:100%;height:auto;border-radius:13px}#nice-offer .nice-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}#nice-offer .nice-box{border:1px solid #e0e7ef;border-radius:16px;padding:20px;background:#fbfcfd}#nice-offer .nice-box h2{text-align:center;margin:0 0 13px;font-size:18px}#nice-offer .nice-features{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}#nice-offer .nice-feature{padding:11px 13px;border-radius:10px;background:#f1f5f9;font-size:13px;font-weight:800;text-align:center}#nice-offer .nice-price{background:linear-gradient(135deg,#0877ff,#0754c7);color:#fff;text-align:center;border-radius:18px;padding:21px;margin:20px 0}.nice-price small{display:block;font-size:14px;font-weight:900}.nice-price strong{display:block;font-size:58px;line-height:1;margin:6px 0}.nice-price em{font-style:normal;font-size:13px;font-weight:700}@media(max-width:700px){#nice-offer .nice-title{font-size:29px}#nice-offer .nice-sub{font-size:15px}#nice-offer .nice-photo{padding:7px}#nice-offer .nice-grid{grid-template-columns:1fr}#nice-offer .nice-features{grid-template-columns:1fr}#nice-offer .nice-price strong{font-size:46px}}'''
          html='''<section id="nice-offer"><div class="badge" style="display:block;width:max-content;margin:0 auto;background:#eaf3ff;color:#0877ff">SUPER OFERTĂ · SEPTEMBRIE</div><h2 class="nice-title"><span>Nice</span> Robus 600 HS</h2><p class="nice-sub">Automatizare poartă culisantă până la 600 kg / 8 m</p><div class="nice-photo"><img src="/assets/nice-robus-600hs.jpg?v=10" alt="Nice Robus 600 HS - automatizare poartă culisantă"></div><div class="nice-grid"><section class="nice-box"><h2>Caracteristici</h2><div class="nice-features"><div class="nice-feature">⚡ Motor Hi-Speed 24V</div><div class="nice-feature">📱 Wi-Fi integrat</div><div class="nice-feature">🔗 BlueBUS</div><div class="nice-feature">🛡️ Fotocelule de siguranță</div><div class="nice-feature">🎮 2 telecomenzi incluse</div><div class="nice-feature">💡 Lampă de semnalizare</div></div></section><section class="nice-box"><h2>Oferta include</h2><p class="include">✔ Kit Nice Robus 600 HS<br>✔ Montaj profesional<br>✔ Reglaje și programare<br>✔ Probe funcționale<br>✔ Suport tehnic<br>✔ Garanție 2 ani</p></section></div><div class="nice-price"><small>PREȚ CU TOT CU INSTALARE</small><strong>3.790 lei</strong><em>Kit + montaj inclus</em></div><div class="actions"><a class="primary" href="tel:0733928730">📞 Sună acum: 0733 928 730</a><a class="secondary" href="/asociatii.html?mode=business">✉ Solicită ofertă</a></div></section>'''
          if '</style>' not in s or '</main>' not in s:
              raise SystemExit('Unexpected offer page structure')
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace('</main>',html+'</main>',1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/add-nice-offer-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oferta-bft.html .github/workflows/add-nice-offer-once.yml
          git commit -m 'Add Nice offer while preserving BFT design [skip ci]'
          git push