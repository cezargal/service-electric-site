name: Finalize Nice offer
on:
  push:
    paths:
      - '.github/workflows/finalize-nice-offer.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Nice image and button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('oferta-bft.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/assets/nice-offer.jpg?v=1','/assets/nice-offer-embedded.svg?v=2')
          s=s.replace('🔥 SUPER OFERTĂ</a>','🔥 OFERTA NICE</a>')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/finalize-nice-offer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oferta-bft.html .github/workflows/finalize-nice-offer.yml
          git commit -m 'Finalize Nice offer presentation [skip ci]'
          git push
