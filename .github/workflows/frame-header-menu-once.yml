name: Frame header navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Style header navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='HEADER-FRAME-2026'
          if marker in s:
              raise SystemExit('already applied')
          css='''<style id="header-frame-2026">/* HEADER-FRAME-2026 */
          .links{padding:5px;border:1px solid #dfe7ee;border-radius:13px;background:rgba(248,250,252,.92);box-shadow:0 4px 16px rgba(16,36,58,.06);gap:3px;white-space:nowrap}
          .links a{display:inline-flex;align-items:center;justify-content:center;padding:8px 10px;border:1px solid transparent;border-radius:9px;white-space:nowrap;transition:.2s}
          .links a:hover{background:#fff;border-color:#d7e5f0;box-shadow:0 3px 10px rgba(16,36,58,.07)}
          .links .portalNav{padding:8px 11px;border-color:#cce4f8;background:#eaf5ff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
          .phoneGroup{padding:6px 8px;border:1px solid #dfe7ee;border-radius:13px;background:#fff;box-shadow:0 4px 16px rgba(16,36,58,.05);gap:10px}
          .phoneItem{padding:2px 5px}
          .phoneDivider{height:30px}
          @media(max-width:1180px) and (min-width:951px){.links{padding:4px;gap:2px}.links a{padding:7px 7px;font-size:11px}.links .portalNav{padding:7px 8px}.phoneGroup{padding:5px 6px;gap:7px}.phoneItem{padding:2px 3px}.phoneItem a{font-size:11px}}
          </style>'''
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Frame header navigation neatly"
          git push
          rm -f .github/workflows/frame-header-menu-once.yml
          git add .github/workflows/frame-header-menu-once.yml
          git commit -m "Remove temporary header workflow"
          git push
