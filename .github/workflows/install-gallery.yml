name: Install gallery images
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: ${{ hashFiles('.upload-gallery/manifest') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild image archive
        run: |
          mkdir -p /tmp/gallery
          cat .upload-gallery/chunk-* | base64 -d > /tmp/gallery/gallery.zip
          unzip -o /tmp/gallery/gallery.zip -d /tmp/gallery/out
          cp /tmp/gallery/out/lucrare-01.jpg images/lucrare-01.jpg
          cp /tmp/gallery/out/lucrare-02.jpg images/lucrare-02.jpg
          cp /tmp/gallery/out/lucrare-03.jpg images/lucrare-03.jpg
          rm -rf .upload-gallery
      - name: Commit gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/lucrare-01.jpg images/lucrare-02.jpg images/lucrare-03.jpg .upload-gallery
          git commit -m "Adaugă fotografiile originale în galeria lucrărilor" || exit 0
          git push
