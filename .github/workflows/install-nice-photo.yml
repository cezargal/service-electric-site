name: Install Nice offer photo
on:
  push:
    paths:
      - '.github/workflows/install-nice-photo.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download high resolution Nice image
        run: |
          curl -L --fail --retry 3 'https://nice.ro/images/detailed/13/nice-robus-600HS-kit-BDKCE_-ROA6.jpg' -o assets/nice-offer.jpg
          file assets/nice-offer.jpg
          test $(stat -c%s assets/nice-offer.jpg) -gt 50000
      - name: Use local image and add home button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('oferta-bft.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(<div class="nice-photo">\s*<img\s+src=["\'])([^"\']+)(["\'])', r'\1/assets/nice-offer.jpg?v=1\3', s, count=1)
          if '/assets/nice-offer.jpg?v=1' not in s:
              raise SystemExit('Nice image tag not found')
          if 'class="home"' not in s:
              s=s.replace('<body>', '<body><a class="home" href="/">← Înapoi acasă</a>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/nice-offer.jpg oferta-bft.html .github/workflows/install-nice-photo.yml
          git commit -m 'Use local high resolution Nice offer photo [skip ci]'
          git push
          rm -f .github/workflows/install-nice-photo.yml
