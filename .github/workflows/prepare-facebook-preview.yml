name: Prepare Facebook Preview
on:
  push:
    paths:
      - '.github/workflows/prepare-facebook-preview.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Open Graph tags only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<meta property="og:title" content="[^"]*">', '<meta property="og:title" content="SERVICE ELECTRIC | Interfoane, Automatizări, Control Acces & Securitate">', s, count=1)
          s = re.sub(r'<meta property="og:description" content="[^"]*">', '<meta property="og:description" content="Interfoane, videointerfoane, control acces, automatizări porți, supraveghere video și sisteme de alarmă. SERVICE ELECTRIC by Cezar Gălățanu.">', s, count=1)
          marker = '<meta property="og:description" content="Interfoane, videointerfoane, control acces, automatizări porți, supraveghere video și sisteme de alarmă. SERVICE ELECTRIC by Cezar Gălățanu.">'
          tags = marker + '<meta property="og:image" content="https://service-electric.ro/images/IMG_20260404_101440.jpg"><meta property="og:image:secure_url" content="https://service-electric.ro/images/IMG_20260404_101440.jpg"><meta property="og:image:type" content="image/jpeg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="SERVICE ELECTRIC - interfoane, automatizări, control acces și securitate">'
          s = s.replace(marker, tags, 1)
          s = s.replace('<meta name="twitter:card" content="summary_large_image">', '<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="SERVICE ELECTRIC | Interfoane, Automatizări, Control Acces & Securitate"><meta name="twitter:description" content="Soluții tehnice complete pentru interfonie, acces, automatizări, supraveghere și alarmare."><meta name="twitter:image" content="https://service-electric.ro/images/IMG_20260404_101440.jpg">', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -o 'og:image[^>]*' index.html | head -1
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Optimize homepage preview for Facebook'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/prepare-facebook-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/prepare-facebook-preview.yml
          git diff --cached --quiet || git commit -m 'Remove temporary Facebook preview workflow'
          git push
