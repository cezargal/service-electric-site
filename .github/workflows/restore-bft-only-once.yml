name: Restore BFT-only offer page

on:
  push:
    paths:
      - '.github/workflows/restore-bft-only-once.yml'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore proven BFT-only version
        run: |
          git checkout 3d0d69735b8e53ff40c8fb90b39f8e98a54b7ca7 -- oferta-bft.html
          rm -f .github/workflows/restore-bft-only-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oferta-bft.html .github/workflows/restore-bft-only-once.yml
          git commit -m 'Restore BFT-only offer page [skip ci]'
          git push
