name: Restore functional top menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-menu:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lucrari executate menu item
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="#servicii">Servicii</a><a href="#pentru-cine">Pentru cine</a>'
          new = '<a href="#servicii">Servicii</a><a href="/lucrari-executate.html">Lucrări executate</a><a href="#pentru-cine">Pentru cine</a>'
          if new not in s:
              if old not in s:
                  raise SystemExit('Expected menu pattern not found; no changes made.')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit only the menu correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Menu already correct."
            exit 0
          fi
          git commit -m "Restore functional completed works menu"
          git push
