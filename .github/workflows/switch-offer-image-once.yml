name: Use new Nice Robus offer image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch offer image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('oferta-bft.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/assets/bft-site-hd.jpg','/assets/nice-robus-600hs.jpg')
          s=s.replace('/assets/bft-site-hd.jpg?v=4','/assets/nice-robus-600hs.jpg?v=1')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oferta-bft.html
          git commit -m 'Set Nice Robus 600 HS offer image'
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/switch-offer-image-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/switch-offer-image-once.yml
          git commit -m 'Remove temporary offer image workflow'
          git push