name: Upgrade photo gallery
on:
  push:
    paths:
      - '.github/workflows/upgrade-gallery.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gallery
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.projects{background:#fff}.projectGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.projectCard{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:#071321;box-shadow:0 14px 38px #10243a0d;min-height:310px}.projectCard img{display:block;width:100%;height:310px;object-fit:cover;transition:transform .5s ease,filter .35s ease}.projectCard:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,#06111de6 100%);pointer-events:none}.projectCard:hover img{transform:scale(1.035);filter:brightness(1.05)}.projectInfo{position:absolute;left:25px;right:25px;bottom:22px;z-index:2;color:#fff}.projectTag{font-size:8px;font-weight:950;letter-spacing:1.5px;color:#72bdff}.projectInfo h3{font-size:22px;line-height:1.08;margin:7px 0 5px}.projectInfo p{font-size:12px;color:#c0cfdb;margin:0}.projectMore{display:none}'
          new_css = old_css + '.projectCard{cursor:zoom-in}.projectCard:focus-visible{outline:2px solid #55b5ff;outline-offset:3px}.galleryMore{text-align:center;margin-top:22px;color:#71808e;font-size:11px;font-weight:800;letter-spacing:.8px}.lightbox{position:fixed;inset:0;z-index:10000;background:#020811f2;display:none;align-items:center;justify-content:center;padding:28px}.lightbox.open{display:flex}.lightbox img{max-width:min(1100px,92vw);max-height:84vh;width:auto;height:auto;object-fit:contain;border-radius:16px;box-shadow:0 30px 90px #0009}.lightboxClose,.lightboxPrev,.lightboxNext{position:absolute;border:1px solid #ffffff2e;background:#071321e8;color:#fff;border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer;display:grid;place-items:center}.lightboxClose{top:22px;right:22px}.lightboxPrev{left:22px;top:50%;transform:translateY(-50%)}.lightboxNext{right:22px;top:50%;transform:translateY(-50%)}.lightboxClose:hover,.lightboxPrev:hover,.lightboxNext:hover{background:#0d2d47;border-color:#55b5ff}.lightboxCount{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#c7d9e8;font-size:10px;font-weight:900;letter-spacing:1px}@media(max-width:600px){.lightbox{padding:16px}.lightboxPrev{left:10px}.lightboxNext{right:10px}.lightboxClose{top:12px;right:12px}.lightbox img{max-width:94vw;max-height:78vh}}'
          if old_css not in s:
              raise SystemExit('Expected gallery CSS was not found; aborting without changes.')
          s = s.replace(old_css, new_css, 1)
          old_section = '<section class="projects" id="lucrari"><div class="wrap"><div class="head"><div class="ey">Lucrări realizate</div><h2>Vezi ce facem în teren.</h2><p>Exemple reale de lucrări executate de SERVICE ELECTRIC — de la intervenții și modernizări până la sisteme complete.</p></div><div class="projectGrid"><a class="projectCard" href="/interfoane-botosani.html"><img src="/images/IMG_20260404_101440.jpg" alt="Lucrări reale de interfonie, automatizare și control acces"><div class="projectInfo"><div class="projectTag">LUCRĂRI REALE • 01–03</div><h3>Interfonie & automatizare</h3><p>Instalații, automatizări și soluții de acces.</p></div></a><a class="projectCard" href="/control-acces.html"><img src="/images/IMG_2238.JPG" alt="Lucrări reale de videointerfonie, automatizare și interfonie"><div class="projectInfo"><div class="projectTag">LUCRĂRI REALE • 04–06</div><h3>Acces & videointerfonie</h3><p>Montaj, modernizare și integrare.</p></div></a><a class="projectCard" href="/control-acces.html"><img src="/images/IMG_2240.JPG" alt="Lucrări reale de control acces și interfonie"><div class="projectInfo"><div class="projectTag">LUCRĂRI REALE • 07–09</div><h3>Control acces & interfonie</h3><p>Sisteme montate și configurate în teren.</p></div></a></div></div></section>'
          new_section = '<section class="projects" id="lucrari"><div class="wrap"><div class="head"><div class="ey">Lucrări realizate</div><h2>Lucrări reale, rezultate reale.</h2><p>O selecție de lucrări executate și configurate de SERVICE ELECTRIC. Apasă pe orice fotografie pentru vizualizare.</p></div><div class="projectGrid"><a class="projectCard galleryItem" href="/images/IMG_20260404_101440.jpg" data-gallery="0" aria-label="Deschide fotografia: Lucrare de interfonie"><img src="/images/IMG_20260404_101440.jpg" alt="Lucrare reală de interfonie"><div class="projectInfo"><div class="projectTag">LUCRARE REALĂ</div><h3>Interfonie</h3><p>Montaj și configurare sistem</p></div></a><a class="projectCard galleryItem" href="/images/IMG_2238.JPG" data-gallery="1" aria-label="Deschide fotografia: Automatizare acces"><img src="/images/IMG_2238.JPG" alt="Lucrare reală de automatizare acces"><div class="projectInfo"><div class="projectTag">LUCRARE REALĂ</div><h3>Automatizare acces</h3><p>Montaj și punere în funcțiune</p></div></a><a class="projectCard galleryItem" href="/images/IMG_2240.JPG" data-gallery="2" aria-label="Deschide fotografia: Control acces"><img src="/images/IMG_2240.JPG" alt="Lucrare reală de control acces"><div class="projectInfo"><div class="projectTag">LUCRARE REALĂ</div><h3>Control acces</h3><p>Montaj și configurare</p></div></a></div><div class="galleryMore">GALERIA POATE FI EXTINSĂ ORICÂND CU NOI FOTOGRAFII DIN LUCRĂRILE TALE.</div></div></section>'
          if old_section not in s:
              raise SystemExit('Expected gallery section was not found; aborting without changes.')
          s = s.replace(old_section, new_section, 1)
          lightbox = '<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Galerie foto"><button class="lightboxClose" type="button" aria-label="Închide">×</button><button class="lightboxPrev" type="button" aria-label="Fotografia anterioară">‹</button><img id="lightboxImg" src="" alt=""><button class="lightboxNext" type="button" aria-label="Fotografia următoare">›</button><div class="lightboxCount" id="lightboxCount"></div></div><script>(function(){const items=[...document.querySelectorAll(".galleryItem")],box=document.getElementById("lightbox"),img=document.getElementById("lightboxImg"),count=document.getElementById("lightboxCount");if(!box||!items.length)return;let i=0;function show(n){i=(n+items.length)%items.length;const a=items[i];img.src=a.getAttribute("href");img.alt=a.querySelector("img")?.alt||"Fotografie lucrare";count.textContent=(i+1)+" / "+items.length;box.classList.add("open");document.body.style.overflow="hidden"}function close(){box.classList.remove("open");document.body.style.overflow="";img.src=""}items.forEach((a,n)=>a.addEventListener("click",e=>{e.preventDefault();show(n)}));box.querySelector(".lightboxClose").addEventListener("click",close);box.querySelector(".lightboxPrev").addEventListener("click",()=>show(i-1));box.querySelector(".lightboxNext").addEventListener("click",()=>show(i+1));box.addEventListener("click",e=>{if(e.target===box)close()});document.addEventListener("keydown",e=>{if(!box.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")show(i-1);if(e.key==="ArrowRight")show(i+1)});})();</script>'
          if '</body>' not in s:
              raise SystemExit('Closing body tag not found; aborting without changes.')
          s = s.replace('</body>', lightbox+'</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit gallery update and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve homepage photo gallery' || exit 0
          git rm .github/workflows/upgrade-gallery.yml
          git commit -m 'Remove temporary gallery workflow'
          git push
