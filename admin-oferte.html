<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SERVICE ELECTRIC — Super Oferte</title><style>
:root{--navy:#071a38;--blue:#0877ff;--bg:#f3f6fa;--line:#e2e8f0;--muted:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Inter,Arial,sans-serif}.top{background:linear-gradient(135deg,#06162f,#123d6b);color:#fff;padding:18px 24px;font-weight:900}.shell{max-width:1000px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 28px #071a3814;margin-bottom:18px}h1,h2{color:var(--navy)}h1{margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}input,textarea{width:100%;padding:11px;border:1px solid #cfd8e5;border-radius:10px;font:inherit}textarea{min-height:100px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid #cbd5e1}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}.offer{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.offer img{width:150px;height:100px;object-fit:cover;border-radius:10px;background:#eef2f6}.tag{font-size:11px;font-weight:900;color:#0877ff}.err,.ok{padding:10px;border-radius:9px;margin-top:10px;font-size:12px}.err{background:#ffe9e9;color:#941c1c}.ok{background:#e8f8ee;color:#145c30}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.offer{grid-template-columns:1fr}.offer img{width:100%;height:170px}}
</style></head><body><header class="top">⚡ SERVICE ELECTRIC · Administrare Super Oferte</header><main class="shell"><div id="login"><div class="panel"><h1>Administrare Super Oferte</h1><p class="muted">Intră cu același cont de administrator folosit la lucrări.</p><input id="email" type="email" placeholder="Email" style="margin-top:12px"><input id="password" type="password" placeholder="Parolă" style="margin-top:10px"><button class="btn primary" id="loginBtn" style="margin-top:12px;width:100%">INTRĂ</button><div id="loginMsg"></div></div></div><div id="app" style="display:none"><div class="panel"><h1>🔥 Super Ofertă</h1><p class="muted">Modifică oferta care apare pe prima pagină. Doar o ofertă poate fi activă.</p><form id="form"><input id="id" type="hidden"><div class="grid"><div><label>Titlu</label><input id="titlu" required></div><div><label>Preț</label><input id="pret" placeholder="3950 lei"></div><div><label>Preț vechi</label><input id="pret_vechi" placeholder="opțional"></div><div><label>Imagine URL</label><input id="imagine_url" placeholder="https://..."></div><div class="full"><label>Descriere</label><textarea id="descriere"></textarea></div><div><label>Text buton</label><input id="buton_text" value="Vezi oferta completă"></div><div><label>Link buton</label><input id="buton_url" value="/oferta-bft.html"></div></div><div class="row"><button type="button" class="btn secondary" id="new">Ofertă nouă</button><button class="btn primary">SALVEAZĂ OFERTA</button></div><div id="msg"></div></form></div><div class="panel"><h2>Oferte salvate</h2><div id="list"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://typlkmoadfzjnhfguypg.supabase.co','sb_publishable_R3KwKUwz9Pwm0oQbap7PvQ_g1S-Citz');const $=id=>document.getElementById(id);
function message(t,ok=false){$('msg').innerHTML='<div class="'+(ok?'ok':'err')+'">'+t+'</div>'}
async function admin(){const {data:{user}}=await sb.auth.getUser();if(!user)return false;const {data}=await sb.from('staff_users').select('role,active').eq('user_id',user.id).maybeSingle();return !!(data&&data.role==='admin'&&data.active)}
async function boot(){if(await admin()){$('login').style.display='none';$('app').style.display='block';load()}else{$('login').style.display='block'}}
$('loginBtn').onclick=async()=>{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').innerHTML='<div class="err">Autentificarea a eșuat.</div>';return}if(!await admin()){await sb.auth.signOut();$('loginMsg').innerHTML='<div class="err">Contul nu are drept de administrator.</div>';return}boot()};
function clearForm(){$('id').value='';$('titlu').value='';$('pret').value='';$('pret_vechi').value='';$('imagine_url').value='';$('descriere').value='';$('buton_text').value='Vezi oferta completă';$('buton_url').value='/oferta-bft.html';$('msg').innerHTML=''}
function edit(o){$('id').value=o.id;$('titlu').value=o.titlu;$('pret').value=o.pret||'';$('pret_vechi').value=o.pret_vechi||'';$('imagine_url').value=o.imagine_url||'';$('descriere').value=o.descriere||'';$('buton_text').value=o.buton_text||'Vezi oferta completă';$('buton_url').value=o.buton_url||'/oferta-bft.html';scrollTo({top:0,behavior:'smooth'})}
async function load(){const {data,error}=await sb.from('super_oferte').select('*').order('updated_at',{ascending:false});if(error){$('list').innerHTML='<div class="err">'+error.message+'</div>';return}$('list').innerHTML=(data||[]).map(o=>'<div class="offer"><img src="'+(o.imagine_url||'')+'" onerror="this.style.display=\'none\'"><div><div class="tag">'+(o.activ?'● ACTIVĂ':'○ INACTIVĂ')+'</div><strong>'+o.titlu+'</strong><div class="muted">'+(o.pret||'')+' · '+(o.descriere||'')+'</div></div><div class="row"><button class="btn secondary" onclick=\'edit('+JSON.stringify(o)+')\'>Modifică</button><button class="btn '+(o.activ?'danger':'primary')+'" onclick="toggle(\''+o.id+'\','+(o.activ?'false':'true')+')">'+(o.activ?'Dezactivează':'Activează')+'</button></div></div>').join('')||'<p class="muted">Nu există oferte.</p>'}
$('form').onsubmit=async e=>{e.preventDefault();const id=$('id').value;const payload={titlu:$('titlu').value.trim(),pret:$('pret').value.trim(),pret_vechi:$('pret_vechi').value.trim(),imagine_url:$('imagine_url').value.trim(),descriere:$('descriere').value.trim(),buton_text:$('buton_text').value.trim(),buton_url:$('buton_url').value.trim(),updated_at:new Date().toISOString()};let r;if(id)r=await sb.from('super_oferte').update(payload).eq('id',id);else r=await sb.from('super_oferte').insert({...payload,activ:false});if(r.error){message(r.error.message);return}message('Oferta a fost salvată.',true);load()};
async function toggle(id,on){if(on)await sb.from('super_oferte').update({activ:false});const r=await sb.from('super_oferte').update({activ:on,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){alert(r.error.message);return}load()}
$('new').onclick=clearForm;boot();
</script></body></html>
